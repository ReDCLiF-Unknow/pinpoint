<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{.Title}} · PinPoint</title>
  {{template "assets"}}
</head>
<body>
<div class="page page-center">
  <div class="container container-tight py-4">
    <div class="empty">
      <div class="empty-icon"><i class="ti ti-{{.Icon}}" style="font-size:3rem"></i></div>
      <p class="empty-title">{{.Title}}</p>
      <p class="empty-subtitle text-secondary">{{.Text}}</p>
      <div class="empty-action"><a href="/" class="btn btn-primary"><i class="ti ti-map-pin me-1"></i>Review a website</a></div>
    </div>
  </div>
</div>
</body>
</html>
